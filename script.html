<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>getsols.xyz / script</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --fg:#f5f5f5;
    --dim:rgba(255,255,255,0.45);
    --line:rgba(255,255,255,0.12);
    --ok:#86efac;
    --accent:#c4b5fd;
  }

  html, body {
    height: 100%;
    background: #000;
    color: var(--fg);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    overflow: hidden;
    cursor: crosshair;
    -webkit-font-smoothing: antialiased;
  }

  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none; z-index: 7;
    background:
      radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.85) 100%),
      repeating-linear-gradient(to bottom,
        rgba(255,255,255,0.02) 0px,
        rgba(255,255,255,0.02) 1px,
        transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
    animation: scanMove 8s linear infinite;
  }
  @keyframes scanMove {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 0, 0 3px; }
  }

  canvas#stars { position: fixed; inset: 0; z-index: 0; }

  .cursor-glow {
    position: fixed; top: 0; left: 0;
    width: 340px; height: 340px; border-radius: 50%;
    pointer-events: none; z-index: 3;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.08) 22%,
      rgba(255,255,255,0.03) 45%, rgba(255,255,255,0) 72%);
    mix-blend-mode: screen;
    transition: opacity 0.35s ease;
  }

  .corner {
    position: fixed; width: 28px; height: 28px;
    border: 1px solid rgba(255,255,255,0.5);
    z-index: 5; pointer-events: none;
    animation: cornerFade 3s ease-in-out infinite alternate;
  }
  .corner.tl { top: 22px;    left: 22px;    border-right: none; border-bottom: none; }
  .corner.tr { top: 22px;    right: 22px;   border-left: none;  border-bottom: none; }
  .corner.bl { bottom: 22px; left: 22px;    border-right: none; border-top: none; }
  .corner.br { bottom: 22px; right: 22px;   border-left: none;  border-top: none; }
  @keyframes cornerFade { 0% { opacity: 0.35; } 100% { opacity: 0.75; } }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.85rem; letter-spacing: 0.06em;
    text-decoration: none; color: #fff;
  }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px #fff, 0 0 20px rgba(255,255,255,0.6);
    animation: dotPulse 1.8s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.85); }
  }
  .brand .sep { color: rgba(255,255,255,0.25); }
  .brand .path b { color: #fff; font-weight: 500; }

  .stage {
    position: relative;
    z-index: 6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 100px 24px 60px;
    text-align: center;
  }

  .heading {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    letter-spacing: 0.18em; font-weight: 700; color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.55), 0 0 30px rgba(255,255,255,0.25);
    animation: titlePulse 4s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.55), 0 0 30px rgba(255,255,255,0.25); }
    50%      { text-shadow: 0 0 14px rgba(255,255,255,0.75), 0 0 40px rgba(255,255,255,0.35); }
  }
  .sub {
    font-size: 0.72rem; letter-spacing: 0.5em;
    text-transform: uppercase; color: var(--dim);
    margin-top: -12px;
  }

  .code-box {
    position: relative;
    width: min(760px, 92vw);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.012));
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px;
    padding: 22px 26px;
    text-align: left;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0,0,0,0.6),
      0 0 40px rgba(255,255,255,0.03) inset;
    transition: border-color 0.3s ease, box-shadow 0.4s ease;
  }
  .code-box:hover {
    border-color: rgba(255,255,255,0.32);
    box-shadow:
      0 24px 80px rgba(0,0,0,0.7),
      0 0 60px rgba(255,255,255,0.06) inset;
  }
  .code-box .label {
    font-size: 0.62rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 12px;
  }
  .code {
    font-size: 0.92rem;
    line-height: 1.7;
    color: #fff;
    word-break: break-all;
    white-space: pre-wrap;
  }
  .code .kw   { color: #c4b5fd; }
  .code .str  { color: #86efac; }
  .code .punc { color: rgba(255,255,255,0.7); }

  .buttons {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    display: inline-block;
    padding: 18px 40px;
    background: rgba(255,255,255,0.02);
    color: #fff;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: lowercase;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.55);
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition:
      color 0.3s ease,
      border-color 0.3s ease,
      box-shadow 0.35s ease,
      transform 0.25s ease,
      letter-spacing 0.35s ease;
  }
  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #fff;
    transform: translateX(-101%);
    transition: transform 0.45s cubic-bezier(.65,.05,.36,1);
    z-index: -1;
  }
  .btn:hover {
    color: #000;
    border-color: #fff;
    letter-spacing: 0.4em;
    transform: translateY(-2px);
    box-shadow:
      0 0 24px rgba(255,255,255,0.5),
      0 0 60px rgba(255,255,255,0.22);
  }
  .btn:hover::before { transform: translateX(0); }
  .btn.primary {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  .btn.primary::before { background: #000; }
  .btn.primary:hover   { color: #fff; }
  .btn.ok {
    background: #fff;
    color: #000;
    border-color: #fff;
  }

  .hint {
    font-size: 0.68rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--dim);
    animation: hintFade 3s ease-in-out infinite;
  }
  @keyframes hintFade {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 10px 22px;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    z-index: 9;
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(.16,1,.3,1);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 640px) {
    .stage { padding: 90px 16px 50px; }
    .code-box { padding: 18px 20px; }
    .code { font-size: 0.78rem; }
    .btn { padding: 15px 28px; font-size: 0.75rem; letter-spacing: 0.26em; }
  }
</style>
</head>
<body>

  <canvas id="stars"></canvas>
  <div class="cursor-glow" id="glow"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="topbar">
    <a class="brand" href="/">
      <span class="dot"></span>
      <span>getsols.xyz</span>
      <span class="sep">/</span>
      <span class="path"><b>script</b></span>
    </a>
  </div>

  <main class="stage">
    <h1 class="heading">script</h1>
    <p class="sub">run this in your executor</p>

    <div class="code-box">
      <div class="label">loadstring</div>
      <div class="code" id="code"><span class="kw">loadstring</span><span class="punc">(</span><span class="punc">game</span><span class="punc">:</span><span class="kw">HttpGet</span><span class="punc">(</span><span class="str">"https://getsols.xyz/loader.lua"</span><span class="punc">)</span><span class="punc">)</span><span class="punc">()</span></div>
    </div>

    <div class="buttons">
      <button class="btn primary" id="copyBtn">copy loader</button>
      <a class="btn" href="https://getsols.xyz/loader.lua" target="_blank" rel="noopener">show raw</a>
    </div>

    <p class="hint">paste &amp; execute</p>
  </main>

  <div class="toast" id="toast"></div>

<script>
const LOADER = 'loadstring(game:HttpGet("https://getsols.xyz/loader.lua"))()';
const btn = document.getElementById("copyBtn");
const toast = document.getElementById("toast");

function showToast(msg, ms = 1400) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), ms);
}

btn.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(LOADER);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = LOADER;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
  }
  const original = btn.textContent;
  btn.textContent = "copied ✓";
  btn.classList.add("ok");
  showToast("loader copied");
  setTimeout(() => {
    btn.textContent = original;
    btn.classList.remove("ok");
  }, 1500);
});

/* ===== CURSOR GLOW + STARFIELD ===== */
const glow   = document.getElementById("glow");
const canvas = document.getElementById("stars");
const ctx    = canvas.getContext("2d");
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const target  = { x: 0, y: 0 };
const current = { x: 0, y: 0 };
const cursor  = { x: W / 2, y: H / 2 };
const cursorEased = { x: W / 2, y: H / 2 };

window.addEventListener("mousemove", (e) => {
  target.x = (e.clientX / W) * 2 - 1;
  target.y = (e.clientY / H) * 2 - 1;
  cursor.x = e.clientX;
  cursor.y = e.clientY;
});
window.addEventListener("mouseleave", () => { glow.style.opacity = "0"; });
window.addEventListener("mouseenter", () => { glow.style.opacity = "1"; });

const LAYERS = [
  { count: 140, r: 0.5, speed: 0.005, parallax: 8  },
  { count: 90,  r: 0.9, speed: 0.010, parallax: 20 },
  { count: 45,  r: 1.4, speed: 0.018, parallax: 34 },
];
const layers = LAYERS.map((cfg) => {
  const stars = [];
  for (let i = 0; i < cfg.count; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: cfg.r * (0.7 + Math.random() * 0.6),
      base: 0.3 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      speed: cfg.speed, parallax: cfg.parallax,
    });
  }
  return stars;
});

const meteors = [];
function spawnMeteor() {
  meteors.push({
    x: Math.random() * W, y: -20,
    len: Math.random() * 100 + 80,
    speed: Math.random() * 5 + 5,
    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
  });
}
setInterval(spawnMeteor, 1100);

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, H);

  current.x += (target.x - current.x) * 0.05;
  current.y += (target.y - current.y) * 0.05;
  cursorEased.x += (cursor.x - cursorEased.x) * 0.18;
  cursorEased.y += (cursor.y - cursorEased.y) * 0.18;
  glow.style.transform = `translate(${cursorEased.x}px, ${cursorEased.y}px) translate(-50%, -50%)`;

  for (const stars of layers) {
    for (const s of stars) {
      s.phase += s.speed;
      const a  = s.base + Math.sin(s.phase) * 0.35;
      const px = s.x - current.x * s.parallax;
      const py = s.y - current.y * s.parallax;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, a))})`;
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += Math.cos(m.angle) * m.speed;
    m.y += Math.sin(m.angle) * m.speed;
    const tx = m.x - Math.cos(m.angle) * m.len;
    const ty = m.y - Math.sin(m.angle) * m.len;
    const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
    grad.addColorStop(0,    "rgba(255,255,255,1)");
    grad.addColorStop(0.35, "rgba(255,255,255,0.5)");
    grad.addColorStop(1,    "rgba(255,255,255,0)");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.8;
    ctx.shadowColor = "rgba(255,255,255,0.9)";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.fillStyle = "rgba(255,255,255,1)";
    ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
    ctx.fill();
    if (m.y > H + 100 || m.x > W + 100 || m.x < -100) meteors.splice(i, 1);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
