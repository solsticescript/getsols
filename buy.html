<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sols.xyz keys</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, input, button, select, option, a, div, span, p, h1, h2, h3, h4, h5, h6 {
      text-transform: lowercase !important;
    }

    body {
      background: #000000;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #ffffff;
      line-height: 1.5;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
      animation: fadeUp 0.4s ease-out;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }

    .dc-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      padding: 0.6rem 1rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .dc-btn:hover {
      background: #5865f2;
      border-color: #5865f2;
      color: #fff;
    }

    .dc-btn i {
      font-size: 1.1rem;
    }

    .hero {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .hero h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .hero p {
      font-size: 1rem;
      color: #aaaaaa;
      max-width: 500px;
      margin: 0 auto;
    }

    .sols-card {
      background: #0a0a0a;
      border-radius: 1rem;
      padding: 1.5rem;
      border: 1px solid #333;
      transition: border-color 0.2s;
      margin-bottom: 2rem;
    }

    .sols-card:hover {
      border-color: #666;
    }

    .sols-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 0.5rem;
      transition: background 0.2s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .sols-header:hover {
      background: #111;
    }

    .lua-logo {
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 0.5rem;
      background: #111;
      border: 1px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      pointer-events: none;
    }

    .lua-logo .lua-moon {
      position: absolute;
      width: 2rem;
      height: 2rem;
      background: #ffffff;
      border-radius: 50%;
      left: 0.5rem;
      top: 0.7rem;
    }

    .lua-logo .lua-moon::after {
      content: '';
      position: absolute;
      width: 1.7rem;
      height: 1.7rem;
      background: #111;
      border-radius: 50%;
      left: 0.8rem;
      top: -0.2rem;
    }

    .lua-logo .lua-star {
      position: absolute;
      color: #ffffff;
      font-size: 0.9rem;
      right: 0.5rem;
      top: 0.5rem;
      z-index: 2;
      line-height: 1;
    }

    .lua-logo .lua-text {
      position: absolute;
      bottom: 0.1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.45rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ffffff;
      z-index: 2;
    }

    .sols-title {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      pointer-events: none;
    }

    .sols-title h2 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.2;
    }

    .sols-title span {
      font-size: 0.8rem;
      color: #888888;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .expand-hint {
      margin-left: auto;
      color: #ffffff;
      font-size: 1.5rem;
      transition: transform 0.3s;
      pointer-events: none;
    }

    .sols-header.active .expand-hint {
      transform: rotate(180deg);
    }

    .pricing-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out, margin 0.3s;
      margin-top: 0;
    }

    .pricing-panel.open {
      max-height: 2000px;
      margin-top: 1.5rem;
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }

    @media (max-width: 700px) {
      .pricing-grid {
        grid-template-columns: 1fr;
        gap: 1.2rem;
      }
      .sols-title h2 {
        font-size: 1.4rem;
      }
      .sols-header {
        gap: 0.8rem;
      }
      .hero h1 {
        font-size: 1.8rem;
      }
    }

    .price-option {
      background: #0f0f0f;
      border-radius: 0.8rem;
      padding: 1.5rem 1rem;
      text-align: center;
      border: 1px solid #333;
      transition: border-color 0.2s, transform 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .price-option:hover {
      border-color: #ffffff;
      transform: scale(1.02);
    }

    .price-option:active {
      transform: scale(0.98);
    }

    .price-option i {
      font-size: 1.5rem;
      margin-bottom: 0.8rem;
      color: #ffffff;
      pointer-events: none;
    }

    .price-option h3 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 0.2rem;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    .price-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.1rem;
      pointer-events: none;
    }

    .price-tag small {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      color: #888888;
      letter-spacing: normal;
    }

    .license-badge {
      display: inline-block;
      background: #1a1a1a;
      border-radius: 0.3rem;
      padding: 0.2rem 0.6rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #aaaaaa;
      border: 1px solid #444;
      margin-bottom: 0.5rem;
      pointer-events: none;
    }

    .tap-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #666;
      margin-top: 0.5rem;
      pointer-events: none;
    }

    .loader-section {
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 1rem;
      padding: 1.5rem;
      margin-top: 2rem;
      text-align: left;
    }

    .loader-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .loader-code {
      background: #000;
      border: 1px solid #222;
      border-radius: 0.5rem;
      padding: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #aaa;
      word-break: break-all;
      position: relative;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .loader-code:hover {
      border-color: #666;
    }

    .loader-code .code-text {
      color: #fff;
      user-select: all;
    }

    .loader-code .copy-icon {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      transition: color 0.2s;
    }

    .loader-code:hover .copy-icon {
      color: #fff;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 1rem;
      width: 100%;
      max-width: 450px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      transform: translateY(20px);
      transition: transform 0.3s ease;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      position: relative;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #222;
    }

    .modal-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      font-weight: 800;
      color: #ffffff;
    }

    .modal-price {
      font-family: 'JetBrains Mono', monospace;
      color: #aaaaaa;
      font-size: 1rem;
      margin-top: 0.2rem;
    }

    .close-modal {
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-modal:hover {
      color: #fff;
    }

    .crypto-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
      margin-bottom: 1rem;
    }

    .crypto-btn {
      background: #111;
      border: 1px solid #333;
      color: #fff;
      padding: 1rem;
      border-radius: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .crypto-btn:hover {
      border-color: #fff;
      background: #1a1a1a;
    }

    .crypto-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .crypto-btn.full-width {
      grid-column: span 2;
    }

    @media (max-width: 500px) {
      .crypto-btn.full-width {
        grid-column: span 1;
      }
    }

    .crypto-address-box {
      display: none;
      background: #111;
      border: 1px solid #444;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-top: 1rem;
      text-align: center;
    }

    .crypto-address-box.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .address-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #888;
      margin-bottom: 0.5rem;
    }

    .address-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #fff;
      word-break: break-all;
      background: #000;
      padding: 0.8rem;
      border-radius: 0.3rem;
      border: 1px solid #222;
      margin-bottom: 0.8rem;
      user-select: all;
    }

    .paypal-warning {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #ffcc00;
      background: #1a1500;
      border: 1px solid #665500;
      padding: 0.5rem;
      border-radius: 0.3rem;
      margin-bottom: 0.8rem;
      text-align: left;
    }

    .copy-btn-modal {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      width: 100%;
      padding: 0.6rem;
      border-radius: 0.3rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      position: relative;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .copy-btn-modal:hover {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .copy-btn-modal.loading {
      background: #111;
      color: #666;
      border-color: #333;
      cursor: wait;
    }

    .spinner {
      display: none;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      position: absolute;
    }

    .copy-btn-modal.loading .spinner {
      display: block;
    }

    .copy-btn-modal.loading i {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .paid-btn {
      display: none;
      background: #fff;
      border: 1px solid #fff;
      color: #000;
      width: 100%;
      padding: 0.8rem;
      border-radius: 0.3rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    .paid-btn:hover {
      background: #ddd;
      border-color: #ddd;
    }

    .paid-btn.active {
      display: block;
    }

    .success-message {
      display: none;
      background: #111;
      border: 1px dashed #555;
      border-radius: 0.5rem;
      padding: 1.2rem;
      margin-top: 1rem;
      text-align: left;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #fff;
      line-height: 1.6;
      animation: fadeIn 0.3s ease;
    }

    .success-message.active {
      display: block;
    }

    .success-message a {
      color: #fff;
      text-decoration: underline;
      font-weight: bold;
    }

    .success-message a:hover {
      color: #aaa;
    }

    .discord-ticket-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #5865f2;
      border: 1px solid #5865f2;
      color: #fff;
      width: 100%;
      padding: 0.8rem;
      border-radius: 0.3rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 0.85rem;
      text-decoration: none;
      margin-top: 0.8rem;
      transition: all 0.2s;
    }

    .discord-ticket-btn:hover {
      background: #4752c4;
      border-color: #4752c4;
    }

    .giftcard-container {
      display: none;
      margin-top: 1rem;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 0.5rem;
      padding: 1rem;
      animation: fadeIn 0.3s ease;
    }

    .giftcard-container.active {
      display: block;
    }

    .giftcard-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #aaa;
      margin-bottom: 0.5rem;
      display: block;
    }

    .giftcard-select {
      width: 100%;
      background: #000;
      border: 1px solid #444;
      color: #fff;
      padding: 0.8rem;
      border-radius: 0.3rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      margin-bottom: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }

    .giftcard-select:focus {
      border-color: #fff;
    }

    .giftcard-input {
      width: 100%;
      background: #000;
      border: 1px solid #444;
      color: #fff;
      padding: 0.8rem;
      border-radius: 0.3rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      margin-bottom: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .giftcard-input:focus {
      border-color: #fff;
    }

    .submit-giftcard-btn {
      background: #222;
      border: 1px solid #444;
      color: #fff;
      width: 100%;
      padding: 0.6rem;
      border-radius: 0.3rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .submit-giftcard-btn:hover {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .submit-giftcard-btn.loading {
      background: #111;
      color: #666;
      border-color: #333;
      cursor: wait;
    }

    .submit-giftcard-btn .spinner {
      border-top-color: #fff;
      position: relative;
      display: inline-block;
      vertical-align: middle;
      margin-right: 0.5rem;
      margin-bottom: 0.1rem;
    }

    .submit-giftcard-btn.loading .spinner {
      display: inline-block;
    }

    .cart-toast {
      background: #111111;
      border-left: 3px solid #ffffff;
      padding: 0.8rem 1.2rem;
      border-radius: 0.4rem;
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: #ffffff;
      width: 100%;
      border: 1px solid #333;
    }

    .cart-toast i {
      color: #ffffff;
      font-size: 1.1rem;
    }

    #cartFeedback {
      min-height: 50px;
    }

    footer {
      margin-top: 1.5rem;
      text-align: center;
      color: #666666;
      font-size: 0.8rem;
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
    }

    @media (max-width: 500px) {
      body {
        padding: 1.5rem 0.8rem;
      }
      .hero h1 {
        font-size: 1.6rem;
      }
      .sols-card {
        padding: 1rem;
      }
      .pricing-panel.open {
        max-height: 2000px;
      }
      .crypto-options {
        grid-template-columns: 1fr;
      }
      .top-bar {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="https://discord.gg/ZjzktnrhBD" target="_blank" class="dc-btn">
        <i class="fab fa-discord"></i> join discord
      </a>
    </div>

    <div class="hero">
      <h1>sols.xyz</h1>
      <p>click the lua logo below to view licensing options.</p>
    </div>

    <div class="sols-card">
      <div class="sols-header" id="solsHeader">
        <div class="lua-logo">
          <div class="lua-moon"></div>
          <div class="lua-star">★</div>
          <div class="lua-text">lua</div>
        </div>
        <div class="sols-title">
          <h2>sols.xyz keys</h2>
          <span>premium script access</span>
        </div>
        <i class="fas fa-chevron-down expand-hint" id="expandHint"></i>
      </div>

      <div class="pricing-panel" id="pricingPanel">
        <div class="pricing-grid">
          <div class="price-option" onclick="openPaymentModal('Lifetime', '10')">
            <i class="fas fa-infinity"></i>
            <h3>lifetime</h3>
            <div class="price-tag">$10 <small>once</small></div>
            <div class="license-badge">forever</div>
            <div class="tap-hint">select</div>
          </div>
          <div class="price-option" onclick="openPaymentModal('Monthly', '6')">
            <i class="fas fa-calendar-alt"></i>
            <h3>monthly</h3>
            <div class="price-tag">$6 <small>/mo</small></div>
            <div class="license-badge">30 days</div>
            <div class="tap-hint">select</div>
          </div>
          <div class="price-option" onclick="openPaymentModal('Weekly', '4')">
            <i class="fas fa-calendar-week"></i>
            <h3>weekly</h3>
            <div class="price-tag">$4 <small>
