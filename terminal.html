<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>getsols.xyz / discord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --fg:#f5f5f5; --dim:rgba(255,255,255,0.45); --ok:#86efac; --accent:#c4b5fd; }

  html, body {
    min-height: 100%;
    background: #000;
    color: var(--fg);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    overflow-x: hidden;
    cursor: crosshair;
    -webkit-font-smoothing: antialiased;
  }

  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none; z-index: 7;
    background:
      radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.85) 100%),
      repeating-linear-gradient(to bottom,
        rgba(255,255,255,0.02) 0px,
        rgba(255,255,255,0.02) 1px,
        transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
    animation: scanMove 8s linear infinite;
  }
  @keyframes scanMove {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 0, 0 3px; }
  }

  canvas#stars { position: fixed; inset: 0; z-index: 0; }
  canvas#fx    { position: fixed; inset: 0; z-index: 4; pointer-events: none; }

  .cursor-glow {
    position: fixed; top: 0; left: 0;
    width: 340px; height: 340px; border-radius: 50%;
    pointer-events: none; z-index: 3;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.08) 22%,
      rgba(255,255,255,0.03) 45%, rgba(255,255,255,0) 72%);
    mix-blend-mode: screen;
    transition: opacity 0.35s ease;
  }

  .corner {
    position: fixed; width: 28px; height: 28px;
    border: 1px solid rgba(255,255,255,0.5);
    z-index: 5; pointer-events: none;
    animation: cornerFade 3s ease-in-out infinite alternate;
  }
  .corner.tl { top: 22px;    left: 22px;    border-right: none; border-bottom: none; }
  .corner.tr { top: 22px;    right: 22px;   border-left: none;  border-bottom: none; }
  .corner.bl { bottom: 22px; left: 22px;    border-right: none; border-top: none; }
  .corner.br { bottom: 22px; right: 22px;   border-left: none;  border-top: none; }
  @keyframes cornerFade { 0% { opacity: 0.35; } 100% { opacity: 0.75; } }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.85rem; letter-spacing: 0.06em;
    text-decoration: none; color: #fff;
  }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px #fff, 0 0 20px rgba(255,255,255,0.6);
    animation: dotPulse 1.8s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.85); }
  }
  .brand .sep { color: rgba(255,255,255,0.25); }
  .brand .path b { color: #fff; font-weight: 500; }

  .stage {
    position: relative; z-index: 6;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 26px;
    padding: 100px 24px 60px;
    text-align: center;
  }

  .heading {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    letter-spacing: 0.18em; font-weight: 700; color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.55), 0 0 30px rgba(255,255,255,0.25);
    animation: titlePulse 4s ease-in-out infinite;
    transition: filter 0.2s ease, transform 0.15s ease;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.55), 0 0 30px rgba(255,255,255,0.25); }
    50%      { text-shadow: 0 0 14px rgba(255,255,255,0.75), 0 0 40px rgba(255,255,255,0.35); }
  }
  .sub {
    font-size: 0.72rem; letter-spacing: 0.5em;
    text-transform: uppercase; color: var(--dim);
    margin-top: -12px;
  }

  .terminal {
    width: min(760px, 92vw);
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    overflow: hidden;
    text-align: left;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.7),
      0 0 40px rgba(255,255,255,0.04) inset;
    transition: border-color 0.3s ease, box-shadow 0.4s ease, transform 0.2s ease;
    animation: termIn 0.9s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes termIn {
    from { opacity: 0; transform: translateY(24px) scale(0.98); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0)   scale(1);    filter: blur(0); }
  }
  .terminal:focus-within {
    border-color: rgba(255,255,255,0.35);
    box-shadow:
      0 24px 80px rgba(0,0,0,0.8),
      0 0 60px rgba(255,255,255,0.08) inset,
      0 0 60px rgba(255,255,255,0.08);
  }
  .terminal.shake {
    animation: shake 0.35s ease;
  }
  @keyframes shake {
    0%,100% { transform: translate(0, 0); }
    20%     { transform: translate(-4px, 2px); }
    40%     { transform: translate(4px, -2px); }
    60%     { transform: translate(-3px, -1px); }
    80%     { transform: translate(3px, 1px); }
  }
  .terminal.glow-burst {
    box-shadow:
      0 24px 80px rgba(0,0,0,0.8),
      0 0 80px rgba(255,255,255,0.35) inset,
      0 0 90px rgba(255,255,255,0.28);
    border-color: rgba(255,255,255,0.6);
  }

  .term-header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.015);
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .term-header .dots { display: flex; gap: 6px; }
  .term-header .dots i {
    display: block; width: 10px; height: 10px;
    border-radius: 50%; background: rgba(255,255,255,0.18);
    animation: dotBlink 4s ease-in-out infinite;
  }
  .term-header .dots i:nth-child(2) { animation-delay: 0.4s; }
  .term-header .dots i:nth-child(3) { animation-delay: 0.8s; }
  @keyframes dotBlink {
    0%, 90%, 100% { opacity: 0.18; }
    95% { opacity: 0.7; }
  }
  .term-header .title { color: #fff; letter-spacing: 0.14em; margin-left: 4px; }
  .term-header .right {
    margin-left: auto;
    font-size: 0.62rem;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.35);
    position: relative;
  }
  .term-header .right::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--ok);
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: 0.08em;
    box-shadow: 0 0 10px var(--ok);
    animation: pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.7); }
  }

  .term-body {
    padding: 20px 22px 22px;
    font-size: 0.86rem;
    line-height: 1.75;
    max-height: 480px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.2) transparent;
    scroll-behavior: smooth;
  }
  .term-body::-webkit-scrollbar { width: 6px; }
  .term-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 3px; }

  .term-line {
    white-space: pre-wrap; word-break: break-word;
    animation: lineIn 0.28s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes lineIn {
    from { opacity: 0; transform: translateY(4px); filter: blur(2px); }
    to   { opacity: 1; transform: translateY(0);   filter: blur(0); }
  }
  .term-line.sys    { color: rgba(255,255,255,0.5); }
  .term-line.ok     { color: var(--ok); }
  .term-line.err    { color: #f87171; }
  .term-line.hi     { color: #fff; }
  .term-line.dim    { color: rgba(255,255,255,0.4); }
  .term-line b      { color: #fff; font-weight: 700; }
  .term-line .k     { color: var(--accent); }

  .term-line.input  { color: #fff; }
  .term-line.input::before {
    content: "› ";
    color: var(--ok);
    margin-right: 2px;
  }

  .term-prompt {
    display: flex; align-items: center;
    padding: 12px 22px 18px;
    border-top: 1px solid rgba(255,255,255,0.06);
    gap: 10px;
    position: relative;
  }
  .term-prompt .sign {
    color: var(--ok);
    font-weight: 700;
    text-shadow: 0 0 8px rgba(134,239,172,0.6);
    animation: signPulse 2s ease-in-out infinite;
  }
  @keyframes signPulse {
    0%, 100% { text-shadow: 0 0 8px rgba(134,239,172,0.6); }
    50%      { text-shadow: 0 0 16px rgba(134,239,172,1), 0 0 30px rgba(134,239,172,0.5); }
  }
  .term-prompt input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 0.88rem;
    color: #fff;
    caret-color: var(--ok);
  }
  .term-prompt input::placeholder {
    color: rgba(255,255,255,0.25);
  }

  .hint {
    font-size: 0.68rem; letter-spacing: 0.5em;
    text-transform: uppercase; color: var(--dim);
    animation: hintFade 3s ease-in-out infinite;
  }
  @keyframes hintFade {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  .footer-credit {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    font-size: 0.68rem;
    letter-spacing: 0.35em;
    text-transform: lowercase;
    color: rgba(255,255,255,0.35);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: creditGlow 4s ease-in-out infinite;
  }
  .footer-credit:hover {
    color: #fff;
    border-color: rgba(255,255,255,0.4);
  }
  .footer-credit b {
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-shadow: 0 0 10px rgba(255,255,255,0.6);
  }
  .footer-credit::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent);
    animation: pulseDot 1.8s ease-in-out infinite;
  }
  @keyframes creditGlow {
    0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.06); }
    50%      { box-shadow: 0 0 40px rgba(255,255,255,0.16); }
  }

  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 10px 22px;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    z-index: 9;
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(.16,1,.3,1);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 640px) {
    .term-body { font-size: 0.8rem; padding: 16px 16px; max-height: 400px; }
    .term-prompt { padding: 10px 16px 16px; }
    .footer-credit { font-size: 0.6rem; padding: 8px 14px; letter-spacing: 0.25em; }
  }
</style>
</head>
<body>

  <canvas id="stars"></canvas>
  <canvas id="fx"></canvas>
  <div class="cursor-glow" id="glow"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="topbar">
    <a class="brand" href="/">
      <span class="dot"></span>
      <span>getsols.xyz</span>
      <span class="sep">/</span>
      <span class="path"><b>discord</b></span>
    </a>
  </div>

  <main class="stage">
    <h1 class="heading" id="heading">terminal</h1>
    <p class="sub">type 'help' to begin</p>

    <div class="terminal" id="terminal">
      <div class="term-header">
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="title">getsols@discord</div>
        <div class="right" id="status">online</div>
      </div>

      <div class="term-body" id="body"></div>

      <div class="term-prompt" onclick="document.getElementById('inp').focus()">
        <span class="sign">›</span>
        <input id="inp" autocomplete="off" spellcheck="false" placeholder="type a command..." />
      </div>
    </div>

    <p class="hint">type help to see commands</p>
  </main>

  <div class="footer-credit">
    credits · <b>@sols.xyz</b> on discord
  </div>

  <div class="toast" id="toast"></div>

<script>
const bodyEl   = document.getElementById("body");
const inp      = document.getElementById("inp");
const terminal = document.getElementById("terminal");
const toast    = document.getElementById("toast");

function print(text, cls = "") {
  const div = document.createElement("div");
  div.className = "term-line " + cls;
  div.innerHTML = text;
  bodyEl.appendChild(div);
  bodyEl.scrollTop = bodyEl.scrollHeight;
}
function printInput(text) { print(escapeHtml(text), "input"); }
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function showToast(msg, ms = 1400) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), ms);
}

function shakeTerminal() {
  terminal.classList.remove("shake");
  void terminal.offsetWidth;
  terminal.classList.add("shake");
  setTimeout(() => terminal.classList.remove("shake"), 400);
}

function glowBurst() {
  terminal.classList.add("glow-burst");
  setTimeout(() => terminal.classList.remove("glow-burst"), 500);
}

const bootLines = [
  { t: "initializing terminal...", c: "dim" },
  { t: "connection established", c: "ok" },
  { t: "welcome to getsols.xyz", c: "hi" },
  { t: "", c: "" },
  { t: "type 'help' to see available commands.", c: "dim" },
];
bootLines.forEach((l, i) => setTimeout(() => print(l.t, l.c), i * 220));

const commands = {
  help: {
    desc: "show available commands",
    run() {
      print("available commands:", "hi");
      const cats = {
        "general":  ["help","banner","credits","about","whoami","date","time","clear","history"],
        "getsols":  ["join","discord","script","raw","loader","home","status","version","socials"],
        "fun":      ["roll","flip","8ball","coin","dice","joke","quote","hack","matrix","ascii","random","cat","ship","spam"],
        "utility":  ["ping","echo","calc","uuid","color","password","reverse","upper","lower","len","rain"],
      };
      for (const [cat, cmds] of Object.entries(cats)) {
        print(`  <span class="k">${cat}</span>`, "dim");
        cmds.forEach(c => {
          const d = (commands[c] && commands[c].desc) || "";
          print(`    ${c.padEnd(10, " ")} <span class="dim">${d}</span>`);
        });
      }
    },
  },
  banner: { desc: "show banner", run() { showBanner(); } },
  credits: {
    desc: "who made this",
    run() {
      print("getsols.xyz", "hi");
      print("built by <b>@sols.xyz</b> on discord", "ok");
      print("join the discord:", "dim");
      print("https://discord.gg/4whvyDFNBE", "ok");
    },
  },
  about: {
    desc: "about getsols",
    run() {
      print("getsols.xyz — free scripts, keys, and tools.", "hi");
      print("no paywalls. no bs. just stuff that works.", "dim");
    },
  },
  whoami: {
    desc: "who are you",
    run() {
      print("guest@" + (navigator.platform || "unknown").toLowerCase(), "hi");
      print("you are visiting getsols.xyz", "dim");
    },
  },
  date: { desc: "current date", run() { print(new Date().toDateString(), "hi"); } },
  time: { desc: "current time", run() { print(new Date().toLocaleTimeString(), "hi"); } },
  clear: { desc: "clear terminal", run() { bodyEl.innerHTML = ""; } },
  history: {
    desc: "show command history",
    run() {
      if (!history.length) { print("no commands yet.", "dim"); return; }
      history.forEach((h, i) => print(`  ${String(i + 1).padStart(3, " ")}  ${escapeHtml(h)}`, "dim"));
    },
  },

  join: {
    desc: "open discord",
    run() {
      print("opening discord invite...", "ok");
      print("discord.gg/4whvyDFNBE", "dim");
      showToast("opening discord");
      setTimeout(() => window.open("https://discord.gg/4whvyDFNBE", "_blank"), 400);
    },
  },
  discord: { desc: "alias for join", run() { commands.join.run(); } },
  script: {
    desc: "show the loader",
    run() {
      print("loadstring:", "hi");
      print('<span class="k">loadstring</span>(game:<span class="k">HttpGet</span>(<span style="color:#86efac">"https://getsols.xyz/script.lua"</span>))()');
      print("(copied to clipboard)", "dim");
      navigator.clipboard.writeText(
        'loadstring(game:HttpGet("https://getsols.xyz/script.lua"))()'
      ).catch(() => {});
      showToast("copied to clipboard");
    },
  },
  raw: {
    desc: "open raw script",
    run() {
      print("opening raw script.lua...", "ok");
      setTimeout(() => window.open("https://getsols.xyz/script.lua", "_blank"), 300);
    },
  },
  loader: {
    desc: "go to loader page",
    run() {
      print("redirecting to /loader...", "ok");
      showToast("redirecting");
      setTimeout(() => window.location.href = "/loader", 400);
    },
  },
  home: {
    desc: "go home",
    run() {
      print("redirecting to /...", "ok");
      showToast("redirecting");
      setTimeout(() => window.location.href = "/", 400);
    },
  },
  status: {
    desc: "server status",
    run() {
      print("server: <b>online</b>", "ok");
      print("region: eu-central", "dim");
      print("uptime:  99.98%", "dim");
      print("ping:    24ms", "dim");
    },
  },
  version: {
    desc: "show version info",
    run() {
      print("getsols terminal v2.1", "hi");
      print("build: 2026.10", "dim");
    },
  },
  socials: {
    desc: "show socials",
    run() {
      print("discord  → https://discord.gg/4whvyDFNBE", "hi");
      print("owner    → <b>@sols.xyz</b>", "ok");
      print("website  → https://getsols.xyz", "hi");
    },
  },

  roll: { desc: "roll a dice (1-6)", run() { print(`you rolled: <b>${rand(1,6)}</b>`, "hi"); } },
  flip: { desc: "flip a coin",     run() { print(`it's <b>${Math.random() < 0.5 ? "heads" : "tails"}</b>`, "hi"); } },
  coin: { desc: "alias for flip",  run() { commands.flip.run(); } },
  dice: { desc: "alias for roll",  run() { commands.roll.run(); } },
  "8ball": {
    desc: "ask the magic 8-ball",
    run(args) {
      const answers = [
        "it is certain","without a doubt","yes definitely","most likely",
        "outlook good","signs point to yes","reply hazy, try again",
        "ask again later","cannot predict now","don't count on it",
        "my reply is no","very doubtful","absolutely not",
      ];
      const q = args.join(" ");
      if (q) print(`<span class="dim">q: ${escapeHtml(q)}</span>`);
      print(`a: <b>${pick(answers)}</b>`, "hi");
    },
  },
  joke: {
    desc: "tell a joke",
    run() {
      const jokes = [
        "why do programmers prefer dark mode? because light attracts bugs.",
        "there are 10 types of people: those who understand binary and those who don't.",
        "i would tell you a udp joke but you might not get it.",
        "a sql query walks into a bar, walks up to two tables and asks: can i join you?",
        "why did the developer go broke? because he used up all his cache.",
        "how many programmers does it take to change a light bulb? none, that's a hardware problem.",
      ];
      print(pick(jokes), "hi");
    },
  },
  quote: {
    desc: "random quote",
    run() {
      const quotes = [
        "the best way to predict the future is to invent it.",
        "simplicity is the soul of efficiency.",
        "talk is cheap. show me the code.",
        "first, solve the problem. then, write the code.",
        "programs must be written for people to read.",
        "any fool can write code that a computer understands.",
      ];
      print(`"${pick(quotes)}"`, "hi");
    },
  },
  hack: {
    desc: "definitely not hacking",
    run() {
      const steps = [
        "initializing hack.exe...",
        "bypassing firewall...",
        "cracking encryption...",
        "accessing mainframe...",
        "downloading data...",
        "covering tracks...",
        "done. you are now a hacker.",
      ];
      shakeTerminal();
      steps.forEach((s, i) => setTimeout(() => {
        print(s, i === steps.length - 1 ? "ok" : "dim");
        if (i === steps.length - 1) glowBurst();
      }, i * 380));
    },
  },
  matrix: {
    desc: "go down the rabbit hole",
    run() {
      for (let i = 0; i < 8; i++) {
        const line = Array.from({length: 40}, () => Math.random() < 0.5 ? "1" : "0").join("");
        print(line, "ok");
      }
    },
  },
  ascii: {
    desc: "print some ascii art",
    run() {
      print("  /\\_/\\  ", "hi");
      print(" ( o.o ) ", "hi");
      print("  > ^ <  ", "hi");
      print("  meow   ", "dim");
    },
  },
  cat:    { desc: "alias for ascii", run() { commands.ascii.run(); } },
  random: { desc: "random number 1-100", run() { print(`<b>${rand(1,100)}</b>`, "hi"); } },
  ship: {
    desc: "ship two names",
    run(args) {
      const [a, b] = args;
      if (!a || !b) { print("usage: ship <name1> <name2>", "err"); return; }
      const score = rand(0, 100);
      const filled = Math.round(score / 5);
      const bar = "█".repeat(filled) + "░".repeat(20 - filled);
      print(`${escapeHtml(a)} + ${escapeHtml(b)}`, "hi");
      print(`${bar}  ${score}%`, "ok");
    },
  },
  spam: {
    desc: "spam text (spam <text> <count>)",
    run(args) {
      const count = Math.min(parseInt(args[args.length - 1]) || 5, 20);
      const text = args.slice(0, -1).join(" ") || "getsols.xyz";
      for (let i = 0; i < count; i++) print(escapeHtml(text), "hi");
    },
  },

  ping: {
    desc: "measure latency",
    run() {
      const start = performance.now();
      setTimeout(() => {
        const ms = (performance.now() - start).toFixed(1);
        print(`pong! <b>${ms}ms</b>`, "ok");
      }, rand(20, 80));
    },
  },
  echo: {
    desc: "echo your input",
    run(args) {
      if (!args.length) { print("usage: echo <text>", "err"); return; }
      print(escapeHtml(args.join(" ")), "hi");
    },
  },
  calc: {
    desc: "calculate (e.g. calc 2+2)",
    run(args) {
      const expr = args.join(" ");
      if (!expr) { print("usage: calc <expression>", "err"); return; }
      if (!/^[\d\s+\-*/().%]+$/.test(expr)) {
        print("only numbers and + - * / ( ) % are allowed", "err");
        return;
      }
      try {
        const result = Function('"use strict";return (' + expr + ')')();
        print(`${escapeHtml(expr)} = <b>${result}</b>`, "hi");
      } catch (e) {
        print("invalid expression", "err");
      }
    },
  },
  uuid: {
    desc: "generate a uuid",
    run() {
      const u = "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        const v = c === "x" ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
      print(u, "hi");
    },
  },
  color: {
    desc: "random hex color",
    run() {
      const hex = "#" + Math.floor(Math.random() * 0xFFFFFF).toString(16).padStart(6, "0");
      print(hex, "hi");
      print(`<span style="color:${hex}">████████ this color</span>`);
    },
  },
  password: {
    desc: "generate a password (password [len])",
    run(args) {
      const len = Math.min(parseInt(args[0]) || 16, 64);
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
      let p = "";
      for (let i = 0; i < len; i++) p += chars[Math.floor(Math.random() * chars.length)];
      print(p, "hi");
      print("(generated locally, never sent anywhere)", "dim");
    },
  },
  reverse: { desc: "reverse text", run(args) {
    if (!args.length) { print("usage: reverse <text>", "err"); return; }
    print(escapeHtml(args.join(" ").split("").reverse().join("")), "hi");
  } },
  upper: { desc: "uppercase text", run(args) {
    if (!args.length) { print("usage: upper <text>", "err"); return; }
    print(escapeHtml(args.join(" ").toUpperCase()), "hi");
  } },
  lower: { desc: "lowercase text", run(args) {
    if (!args.length) { print("usage: lower <text>", "err"); return; }
    print(escapeHtml(args.join(" ").toLowerCase()), "hi");
  } },
  len: { desc: "character count", run(args) {
    print(`length: <b>${args.join(" ").length}</b>`, "hi");
  } },
  rain: {
    desc: "make it rain stars",
    run() {
      for (let i = 0; i < 40; i++) {
        setTimeout(() => {
          fxStars.push({
            x: Math.random() * W,
            y: -20,
            vy: 2 + Math.random() * 4,
            vx: (Math.random() - 0.5) * 1.5,
            life: 1,
            r: 1 + Math.random() * 2,
          });
        }, i * 25);
      }
      print("making it rain ✨", "ok");
    },
  },
};

const aliases = {
  "?": "help",
  ls: "help",
  lua: "script",
  invite: "join",
  dc: "join",
  cls: "clear",
  st: "status",
  info: "about",
};

let history = [];
let historyIdx = -1;

inp.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp") {
    e.preventDefault();
    if (!history.length) return;
    historyIdx = Math.min(historyIdx + 1, history.length - 1);
    inp.value = history[history.length - 1 - historyIdx] || "";
    return;
  }
  if (e.key === "ArrowDown") {
    e.preventDefault();
    historyIdx = Math.max(historyIdx - 1, -1);
    inp.value = historyIdx === -1 ? "" : history[history.length - 1 - historyIdx];
    return;
  }
  if (e.key === "Tab") {
    e.preventDefault();
    const partial = inp.value.trim().toLowerCase();
    if (!partial) return;
    const matches = Object.keys(commands).filter(c => c.startsWith(partial));
    if (matches.length === 1) inp.value = matches[0];
    else if (matches.length > 1) print("  " + matches.join("  "), "dim");
    return;
  }
  if (e.key === "Enter") {
    const raw = inp.value.trim();
    if (!raw) return;

    printInput(raw);
    inp.value = "";
    history.push(raw);
    historyIdx = -1;

    const parts = raw.split(/\s+/);
    const cmd = parts[0].toLowerCase();
    const args = parts.slice(1);

    const resolved = commands[cmd] ? cmd : aliases[cmd];

    if (commands[cmd]) {
      commands[cmd].run(args);
    } else if (resolved && commands[resolved]) {
      commands[resolved].run(args);
    } else if (cmd === "sudo" || cmd.startsWith("sudo ")) {
      print("nice try :)", "err");
      shakeTerminal();
    } else if (cmd === "rm" || cmd.startsWith("rm ")) {
      print("permission denied", "err");
      shakeTerminal();
    } else if (cmd === "exit" || cmd === "quit") {
      print("you can never leave...", "err");
    } else if (cmd === "hello" || cmd === "hi" || cmd === "hey") {
      print("hey! type 'help' if you need anything.", "ok");
    } else if (cmd === "thanks" || cmd === "ty") {
      print("you're welcome <3", "ok");
    } else if (cmd === "fuck" || cmd === "shit") {
      print("watch your language", "err");
    } else if (cmd === "42") {
      print("the answer to life, the universe, and everything.", "hi");
    } else {
      print(`command not found: ${escapeHtml(cmd)}`, "err");
      print("type 'help' for a list of commands.", "dim");
    }
  }
});

window.addEventListener("load", () => inp.focus());
document.addEventListener("click", (e) => {
  if (e.target.tagName !== "A") inp.focus();
});

const glow   = document.getElementById("glow");
const canvas = document.getElementById("stars");
const ctx    = canvas.getContext("2d");
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  fx.width  = window.innerWidth;
  fx.height = window.innerHeight;
}
const fx   = document.getElementById("fx");
const fxCtx = fx.getContext("2d");
resize();
window.addEventListener("resize", resize);

const target  = { x: 0, y: 0 };
const current = { x: 0, y: 0 };
const cursor  = { x: W / 2, y: H / 2 };
const cursorEased = { x: W / 2, y: H / 2 };

window.addEventListener("mousemove", (e) => {
  target.x = (e.clientX / W) * 2 - 1;
  target.y = (e.clientY / H) * 2 - 1;
  cursor.x = e.clientX;
  cursor.y = e.clientY;
});
window.addEventListener("mouseleave", () => { glow.style.opacity = "0"; });
window.addEventListener("mouseenter", () => { glow.style.opacity = "1"; });

const LAYERS = [
  { count: 160, r: 0.5, speed: 0.005, parallax: 8  },
  { count: 100, r: 0.9, speed: 0.010, parallax: 22 },
  { count: 55,  r: 1.4, speed: 0.018, parallax: 36 },
];
const layers = LAYERS.map((cfg) => {
  const stars = [];
  for (let i = 0; i < cfg.count; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: cfg.r * (0.7 + Math.random() * 0.6),
      base: 0.3 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      speed: cfg.speed, parallax: cfg.parallax,
    });
  }
  return stars;
});

const meteors = [];
function spawnMeteor() {
  meteors.push({
    x: Math.random() * W, y: -20,
    len: Math.random() * 100 + 80,
    speed: Math.random() * 5 + 5,
    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
  });
}
setInterval(spawnMeteor, 900);

const fxStars = [];
const ripples = [];

document.addEventListener("click", (e) => {
  if (e.target.tagName === "A" || e.target.tagName === "INPUT") return;
  ripples.push({ x: e.clientX, y: e.clientY, r: 0, max: 120, life: 1 });
  for (let i = 0; i < 10; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp  = 1 + Math.random() * 3;
    fxStars.push({
      x: e.clientX, y: e.clientY,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      life: 1,
      r: 1 + Math.random() * 1.5,
    });
  }
});

function drawStars() {
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, H);

  current.x += (target.x - current.x) * 0.05;
  current.y += (target.y - current.y) * 0.05;
  cursorEased.x += (cursor.x - cursorEased.x) * 0.18;
  cursorEased.y += (cursor.y - cursorEased.y) * 0.18;
  glow.style.transform = `translate(${cursorEased.x}px, ${cursorEased.y}px) translate(-50%, -50%)`;

  for (const stars of layers) {
    for (const s of stars) {
      s.phase += s.speed;
      const a  = s.base + Math.sin(s.phase) * 0.35;
      const px = s.x - current.x * s.parallax;
      const py = s.y - current.y * s.parallax;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, a))})`;
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += Math.cos(m.angle) * m.speed;
    m.y += Math.sin(m.angle) * m.speed;
    const tx = m.x - Math.cos(m.angle) * m.len;
    const ty = m.y - Math.sin(m.angle) * m.len;
    const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
    grad.addColorStop(0,    "rgba(255,255,255,1)");
    grad.addColorStop(0.35, "rgba(255,255,255,0.5)");
    grad.addColorStop(1,    "rgba(255,255,255,0)");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.8;
    ctx.shadowColor = "rgba(255,255,255,0.9)";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.fillStyle = "rgba(255,255,255,1)";
    ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
    ctx.fill();
    if (m.y > H + 100 || m.x > W + 100 || m.x < -100) meteors.splice(i, 1);
  }

  requestAnimationFrame(drawStars);
}
drawStars();

function drawFX() {
  fxCtx.clearRect(0, 0, W, H);

  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += (r.max - r.r) * 0.12;
    r.life -= 0.045;
    if (r.life <= 0) { ripples.splice(i, 1); continue; }
    fxCtx.beginPath();
    fxCtx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    fxCtx.strokeStyle = `rgba(255,255,255,${r.life * 0.7})`;
    fxCtx.lineWidth = 1.2;
    fxCtx.stroke();
  }

  for (let i = fxStars.length - 1; i >= 0; i--) {
    const s = fxStars[i];
    s.x += s.vx;
    s.y += s.vy;
    s.vy += 0.06;
    s.vx *= 0.985;
    s.vy *= 0.985;
    s.life -= 0.022;
    if (s.life <= 0 || s.y > H + 50) { fxStars.splice(i, 1); continue; }
    fxCtx.beginPath();
    fxCtx.fillStyle = `rgba(255,255,255,${s.life})`;
    fxCtx.shadowColor = "rgba(255,255,255,0.9)";
    fxCtx.shadowBlur = 8;
    fxCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    fxCtx.fill();
    fxCtx.shadowBlur = 0;
  }

  requestAnimationFrame(drawFX);
}
drawFX();
