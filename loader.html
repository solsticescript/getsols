<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>getsols.xyz — loader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #07060f;
      color: #e5e5e5;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid #1a1a2e;
      background: rgba(7, 6, 15, 0.85);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #a855f7, #22d3ee);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .brand .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 10px #22d3ee;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1;   box-shadow: 0 0 10px #22d3ee; }
      50%      { opacity: 0.5; box-shadow: 0 0 20px #22d3ee; }
    }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .actions button {
      background: #131324;
      color: #e5e5e5;
      border: 1px solid #232340;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.15s ease;
    }
    .actions button:hover {
      background: #1c1c34;
      border-color: #a855f7;
      color: #fff;
    }
    .actions button.copied {
      background: #16a34a;
      border-color: #22c55e;
      color: #fff;
    }
    .code-wrap {
      position: relative;
      padding: 22px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b6b8a;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .meta .right { color: #22d3ee; }
    pre {
      background: #0b0a17;
      border: 1px solid #1a1a2e;
      border-radius: 10px;
      padding: 20px;
      overflow-x: auto;
      font-size: 13.5px;
      line-height: 1.6;
      color: #d4d4e0;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.06);
      position: relative;
    }
    pre::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 10px;
      pointer-events: none;
      background: linear-gradient(135deg, rgba(168,85,247,0.06), transparent 40%, rgba(34,211,238,0.06));
    }
    code {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      white-space: pre;
      display: block;
    }
    .lines {
      color: #333;
      user-select: none;
      margin-right: 18px;
      display: inline-block;
      text-align: right;
      min-width: 30px;
    }
    .state {
      text-align: center;
      padding: 60px 20px;
      color: #6b6b8a;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .state.error { color: #ef4444; }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #232340;
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .caret {
      display: inline-block;
      width: 8px;
      height: 14px;
      background: #22d3ee;
      margin-left: 4px;
      vertical-align: -2px;
      animation: caretBlink 1s step-end infinite;
    }
    @keyframes caretBlink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #3a3a52;
      padding: 30px 20px 40px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .footer a { color: #a855f7; text-decoration: none; }
    .footer a:hover { color: #22d3ee; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      getsols.xyz / loader
    </div>
    <div class="actions">
      <button id="copyRaw">Copy raw</button>
      <button id="copyLoader">Copy loader</button>
      <button id="reload">Reload</button>
    </div>
  </div>

  <div class="code-wrap">
    <div class="meta">
      <span id="fileInfo">script.lua</span>
      <span class="right" id="status">loading…</span>
    </div>
    <pre id="codeBlock" style="display:none;"><code id="codeEl"></code></pre>
    <div class="state" id="state"><span class="spinner"></span>fetching script.lua…</div>
  </div>

  <div class="footer">
    view at <a href="/loader">getsols.xyz/loader</a> · raw at <a href="/script.lua">getsols.xyz/script.lua</a>
  </div>

  <script>
    const codeBlock = document.getElementById('codeBlock');
    const codeEl = document.getElementById('codeEl');
    const stateEl = document.getElementById('state');
    const statusEl = document.getElementById('status');
    const fileInfoEl = document.getElementById('fileInfo');
    let rawText = '';

    const url = '/script.lua?t=' + Date.now();

    async function load() {
      stateEl.style.display = 'block';
      stateEl.classList.remove('error');
      codeBlock.style.display = 'none';
      statusEl.textContent = 'loading…';

      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        rawText = await res.text();

        const lines = rawText.split('\n');
        codeEl.innerHTML =
          lines.map((ln, i) =>
            `<span class="lines">${String(i + 1).padStart(3, ' ')}</span>${escapeHtml(ln)}`
          ).join('\n') + '<span class="caret"></span>';

        codeBlock.style.display = 'block';
        stateEl.style.display = 'none';
        statusEl.textContent = `${lines.length} lines · ${rawText.length} bytes`;
        fileInfoEl.textContent = 'script.lua';
      } catch (err) {
        stateEl.classList.add('error');
        stateEl.textContent = 'Failed to load script.lua — ' + err.message;
        statusEl.textContent = 'error';
      }
    }

    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    document.getElementById('copyRaw').addEventListener('click', async e => {
      try {
        await navigator.clipboard.writeText(rawText);
        flash(e.target, 'Copied!');
      } catch { flash(e.target, 'Failed'); }
    });

    document.getElementById('copyLoader').addEventListener('click', async e => {
      const loader = `-- getsols.xyz\n-- loadstring(game:HttpGet("https://getsols.xyz/script.lua"))()\n-- view: https://getsols.xyz/loader`;
      try {
        await navigator.clipboard.writeText(loader);
        flash(e.target, 'Copied!');
      } catch { flash(e.target, 'Failed'); }
    });

    function flash(btn, text) {
      const orig = btn.textContent;
      btn.textContent = text;
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove('copied');
      }, 1200);
    }

    document.getElementById('reload').addEventListener('click', load);

    load();
  </script>
</body>
</html>
