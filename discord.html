<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>getsols.xyz / discord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --fg:#f5f5f5; --dim:rgba(255,255,255,0.45); }

  html, body {
    min-height: 100%;
    background: #000;
    color: var(--fg);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    overflow-x: hidden;
    cursor: crosshair;
    -webkit-font-smoothing: antialiased;
  }

  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none; z-index: 7;
    background:
      radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.85) 100%),
      repeating-linear-gradient(to bottom,
        rgba(255,255,255,0.02) 0px,
        rgba(255,255,255,0.02) 1px,
        transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
  }

  canvas#stars { position: fixed; inset: 0; z-index: 0; }

  .cursor-glow {
    position: fixed; top: 0; left: 0;
    width: 340px; height: 340px; border-radius: 50%;
    pointer-events: none; z-index: 3;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.08) 22%,
      rgba(255,255,255,0.03) 45%, rgba(255,255,255,0) 72%);
    mix-blend-mode: screen;
    transition: opacity 0.35s ease;
  }

  .corner {
    position: fixed; width: 28px; height: 28px;
    border: 1px solid rgba(255,255,255,0.5);
    z-index: 5; pointer-events: none;
    animation: cornerFade 3s ease-in-out infinite alternate;
  }
  .corner.tl { top: 22px;    left: 22px;    border-right: none; border-bottom: none; }
  .corner.tr { top: 22px;    right: 22px;   border-left: none;  border-bottom: none; }
  .corner.bl { bottom: 22px; left: 22px;    border-right: none; border-top: none; }
  .corner.br { bottom: 22px; right: 22px;   border-left: none;  border-top: none; }
  @keyframes cornerFade { 0% { opacity: 0.35; } 100% { opacity: 0.75; } }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.85rem; letter-spacing: 0.06em;
    text-decoration: none; color: #fff;
  }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px #fff, 0 0 20px rgba(255,255,255,0.6);
    animation: dotPulse 1.8s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.85); }
  }
  .brand .sep { color: rgba(255,255,255,0.25); }
  .brand .path b { color: #fff; font-weight: 500; }

  .stage {
    position: relative; z-index: 6;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 34px; padding: 110px 24px 80px;
    text-align: center;
  }

  .heading {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    letter-spacing: 0.18em; font-weight: 700; color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.55), 0 0 30px rgba(255,255,255,0.25);
    animation: titlePulse 4s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.55), 0 0 30px rgba(255,255,255,0.25); }
    50%      { text-shadow: 0 0 14px rgba(255,255,255,0.75), 0 0 40px rgba(255,255,255,0.35); }
  }
  .sub {
    font-size: 0.72rem; letter-spacing: 0.5em;
    text-transform: uppercase; color: var(--dim);
  }

  /* ---------- Discord button ---------- */
  .discord-btn {
    display: inline-flex; align-items: center; gap: 14px;
    padding: 20px 46px;
    background: #fff; color: #000;
    font-family: inherit; font-size: 0.95rem; font-weight: 700;
    letter-spacing: 0.28em; text-transform: lowercase;
    text-decoration: none;
    border-radius: 8px;
    transition: transform 0.25s ease, box-shadow 0.35s ease, letter-spacing 0.3s ease;
    box-shadow:
      0 0 30px rgba(255,255,255,0.35),
      0 0 80px rgba(255,255,255,0.15);
  }
  .discord-btn:hover {
    transform: translateY(-3px);
    letter-spacing: 0.34em;
    box-shadow:
      0 0 40px rgba(255,255,255,0.6),
      0 0 120px rgba(255,255,255,0.28);
  }
  .discord-btn svg { width: 22px; height: 22px; }

  /* ---------- Music player ---------- */
  .music {
    width: min(640px, 92vw);
    display: flex; flex-direction: column; gap: 14px; align-items: stretch;
  }

  .now-playing {
    display: flex; align-items: center; gap: 12px;
    font-size: 0.7rem; letter-spacing: 0.35em;
    text-transform: uppercase; color: var(--dim);
    justify-content: center;
  }
  .now-playing .bar {
    display: inline-flex; align-items: flex-end; gap: 2px; height: 12px;
  }
  .now-playing .bar i {
    width: 2px; background: #fff; border-radius: 2px;
    animation: eq 0.9s ease-in-out infinite;
  }
  .now-playing .bar i:nth-child(2) { animation-delay: 0.15s; }
  .now-playing .bar i:nth-child(3) { animation-delay: 0.30s; }
  .now-playing .bar i:nth-child(4) { animation-delay: 0.45s; }
  @keyframes eq {
    0%, 100% { height: 4px;  opacity: 0.6; }
    50%      { height: 12px; opacity: 1; }
  }
  .now-playing .track {
    color: #fff;
  }

  /* custom play/pause button */
  .play-btn {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 14px 32px;
    background: rgba(255,255,255,0.03);
    color: #fff;
    font-family: inherit; font-size: 0.78rem; font-weight: 500;
    letter-spacing: 0.32em; text-transform: lowercase;
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.25s ease;
    align-self: center;
  }
  .play-btn:hover {
    background: #fff;
    color: #000;
    border-color: #fff;
    letter-spacing: 0.38em;
    box-shadow: 0 0 30px rgba(255,255,255,0.5);
  }
  .play-btn svg { width: 14px; height: 14px; }

  .hint {
    font-size: 0.68rem; letter-spacing: 0.5em;
    text-transform: uppercase; color: var(--dim);
    animation: hintFade 3s ease-in-out infinite;
  }
  @keyframes hintFade {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }
</style>
</head>
<body>

  <canvas id="stars"></canvas>
  <div class="cursor-glow" id="glow"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="topbar">
    <a class="brand" href="/">
      <span class="dot"></span>
      <span>getsols.xyz</span>
      <span class="sep">/</span>
      <span class="path"><b>discord</b></span>
    </a>
  </div>

  <main class="stage">
    <h1 class="heading">discord</h1>
    <p class="sub">join the community</p>

    <a class="discord-btn" href="https://discord.gg/4whvyDFNBE" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.317 4.369A19.79 19.79 0 0 0 15.432 3c-.2.36-.43.84-.586 1.222a18.27 18.27 0 0 0-5.694 0A12.6 12.6 0 0 0 8.566 3a19.74 19.74 0 0 0-4.886 1.37C.558 8.975-.274 13.447.142 17.858A19.9 19.9 0 0 0 6.11 20.87c.482-.66.912-1.36 1.28-2.096a12.9 12.9 0 0 1-2.015-.973c.169-.124.334-.253.494-.386 3.884 1.8 8.086 1.8 11.926 0 .161.133.325.262.495.386a12.9 12.9 0 0 1-2.017.974c.369.736.797 1.435 1.28 2.095a19.86 19.86 0 0 0 5.968-3.012c.49-5.11-.838-9.543-3.504-13.489ZM8.02 15.153c-1.164 0-2.121-1.07-2.121-2.383 0-1.313.937-2.383 2.121-2.383 1.19 0 2.14 1.078 2.121 2.383 0 1.313-.937 2.383-2.121 2.383Zm7.96 0c-1.164 0-2.121-1.07-2.121-2.383 0-1.313.937-2.383 2.121-2.383 1.19 0 2.14 1.078 2.121 2.383 0 1.313-.931 2.383-2.121 2.383Z"/>
      </svg>
      join discord
    </a>

    <div class="music">
      <div class="now-playing">
        <span class="bar"><i></i><i></i><i></i><i></i></span>
        <span>now playing · <span class="track">the love i lost</span></span>
      </div>

      <button class="play-btn" id="playBtn">
        <svg id="icon" viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 2l10 6-10 6V2z"/>
        </svg>
        <span id="label">play music</span>
      </button>
    </div>

    <p class="hint">click to join</p>
  </main>

<script>
/* ---------- Music ---------- */
const audio = new Audio("/the-love-i-lost-here.mp3");
audio.loop   = true;
audio.volume = 0.55;

const playBtn = document.getElementById("playBtn");
const icon    = document.getElementById("icon");
const label   = document.getElementById("label");

const PLAY_PATH  = "M4 2l10 6-10 6V2z";
const PAUSE_PATH = "M3 2h4v12H3zM9 2h4v12H9z";

function setPlaying(isPlaying) {
  icon.querySelector("path").setAttribute("d", isPlaying ? PAUSE_PATH : PLAY_PATH);
  label.textContent = isPlaying ? "pause" : "play music";
}

/* try autoplay (muted first so browsers allow it) */
audio.muted = true;
audio.play().then(() => {
  setPlaying(true);
  /* unmute on first user gesture */
  const unmute = () => {
    audio.muted = false;
    audio.volume = 0.55;
    window.removeEventListener("click", unmute);
    window.removeEventListener("keydown", unmute);
    window.removeEventListener("touchstart", unmute);
    window.removeEventListener("scroll", unmute);
  };
  window.addEventListener("click", unmute, { once: true });
  window.addEventListener("keydown", unmute, { once: true });
  window.addEventListener("touchstart", unmute, { once: true });
  window.addEventListener("scroll", unmute, { once: true });
}).catch(() => {
  /* autoplay blocked — user will click the play button */
  setPlaying(false);
});

playBtn.addEventListener("click", () => {
  if (audio.paused) {
    audio.muted = false;
    audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
  } else {
    audio.pause();
    setPlaying(false);
  }
});

/* keep icon in sync if user pauses from OS media controls */
audio.addEventListener("play",  () => setPlaying(true));
audio.addEventListener("pause", () => setPlaying(false));

/* ---------- Cursor glow + starfield ---------- */
const glow   = document.getElementById("glow");
const canvas = document.getElementById("stars");
const ctx    = canvas.getContext("2d");
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const target  = { x: 0, y: 0 };
const current = { x: 0, y: 0 };
const cursor  = { x: W / 2, y: H / 2 };
const cursorEased = { x: W / 2, y: H / 2 };

window.addEventListener("mousemove", (e) => {
  target.x = (e.clientX / W) * 2 - 1;
  target.y = (e.clientY / H) * 2 - 1;
  cursor.x = e.clientX;
  cursor.y = e.clientY;
});
window.addEventListener("mouseleave", () => { glow.style.opacity = "0"; });
window.addEventListener("mouseenter", () => { glow.style.opacity = "1"; });

const LAYERS = [
  { count: 140, r: 0.5, speed: 0.005, parallax: 8  },
  { count: 90,  r: 0.9, speed: 0.010, parallax: 20 },
  { count: 45,  r: 1.4, speed: 0.018, parallax: 34 },
];
const layers = LAYERS.map((cfg) => {
  const stars = [];
  for (let i = 0; i < cfg.count; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: cfg.r * (0.7 + Math.random() * 0.6),
      base: 0.3 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      speed: cfg.speed, parallax: cfg.parallax,
    });
  }
  return stars;
});

const meteors = [];
function spawnMeteor() {
  meteors.push({
    x: Math.random() * W, y: -20,
    len: Math.random() * 100 + 80,
    speed: Math.random() * 5 + 5,
    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
  });
}
setInterval(spawnMeteor, 1100);

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, H);

  current.x += (target.x - current.x) * 0.05;
  current.y += (target.y - current.y) * 0.05;
  cursorEased.x += (cursor.x - cursorEased.x) * 0.18;
  cursorEased.y += (cursor.y - cursorEased.y) * 0.18;
  glow.style.transform = `translate(${cursorEased.x}px, ${cursorEased.y}px) translate(-50%, -50%)`;

  for (const stars of layers) {
    for (const s of stars) {
      s.phase += s.speed;
      const a  = s.base + Math.sin(s.phase) * 0.35;
      const px = s.x - current.x * s.parallax;
      const py = s.y - current.y * s.parallax;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, a))})`;
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += Math.cos(m.angle) * m.speed;
    m.y += Math.sin(m.angle) * m.speed;
    const tx = m.x - Math.cos(m.angle) * m.len;
    const ty = m.y - Math.sin(m.angle) * m.len;
    const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
    grad.addColorStop(0,    "rgba(255,255,255,1)");
    grad.addColorStop(0.35, "rgba(255,255,255,0.5)");
    grad.addColorStop(1,    "rgba(255,255,255,0)");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.8;
    ctx.shadowColor = "rgba(255,255,255,0.9)";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.fillStyle = "rgba(255,255,255,1)";
    ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
    ctx.fill();
    if (m.y > H + 100 || m.x > W + 100 || m.x < -100) meteors.splice(i, 1);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
