<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>getsols.xyz / dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --fg:#f5f5f5;
    --dim:rgba(255,255,255,0.45);
    --line:rgba(255,255,255,0.1);
    --ok:#86efac;
    --accent:#c4b5fd;
    --warn:#fbbf24;
  }

  html, body {
    min-height: 100%;
    background: #000;
    color: var(--fg);
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    overflow-x: hidden;
    cursor: crosshair;
    -webkit-font-smoothing: antialiased;
    scroll-behavior: smooth;
  }

  body::after {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none; z-index: 7;
    background:
      radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.85) 100%),
      repeating-linear-gradient(to bottom,
        rgba(255,255,255,0.02) 0px,
        rgba(255,255,255,0.02) 1px,
        transparent 1px, transparent 3px);
    mix-blend-mode: overlay;
    animation: scanMove 8s linear infinite;
  }
  @keyframes scanMove {
    from { background-position: 0 0, 0 0; }
    to   { background-position: 0 0, 0 3px; }
  }

  canvas#stars { position: fixed; inset: 0; z-index: 0; }
  canvas#fx    { position: fixed; inset: 0; z-index: 4; pointer-events: none; }

  .cursor-glow {
    position: fixed; top: 0; left: 0;
    width: 340px; height: 340px; border-radius: 50%;
    pointer-events: none; z-index: 3;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.08) 22%,
      rgba(255,255,255,0.03) 45%, rgba(255,255,255,0) 72%);
    mix-blend-mode: screen;
    transition: opacity 0.35s ease, width 0.35s ease, height 0.35s ease;
  }
  .cursor-glow.big { width: 480px; height: 480px; }

  .corner {
    position: fixed; width: 28px; height: 28px;
    border: 1px solid rgba(255,255,255,0.5);
    z-index: 5; pointer-events: none;
    animation: cornerFade 3s ease-in-out infinite alternate;
  }
  .corner.tl { top: 22px;    left: 22px;    border-right: none; border-bottom: none; }
  .corner.tr { top: 22px;    right: 22px;   border-left: none;  border-bottom: none; }
  .corner.bl { bottom: 22px; left: 22px;    border-right: none; border-top: none; }
  .corner.br { bottom: 22px; right: 22px;   border-left: none;  border-top: none; }
  @keyframes cornerFade { 0% { opacity: 0.35; } 100% { opacity: 0.75; } }

  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.85rem; letter-spacing: 0.06em;
    text-decoration: none; color: #fff;
  }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px #fff, 0 0 20px rgba(255,255,255,0.6);
    animation: dotPulse 1.8s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.85); }
  }
  .brand .sep { color: rgba(255,255,255,0.25); }
  .brand .path b { color: #fff; font-weight: 500; }

  .scroll-progress {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    z-index: 10;
    pointer-events: none;
  }
  .scroll-progress::before {
    content: "";
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: var(--progress, 0%);
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,0.5) 20%,
      #fff 50%,
      rgba(255,255,255,0.5) 80%,
      transparent 100%);
    box-shadow: 0 0 12px rgba(255,255,255,0.7);
    transition: width 0.1s linear;
  }

  .wrap {
    position: relative;
    z-index: 6;
    max-width: 1200px;
    margin: 0 auto;
    padding: 130px 28px 160px;
    animation: wrapIn 0.9s cubic-bezier(.16,1,.3,1) both;
    will-change: filter;
    transition: filter 0.2s ease;
  }
  @keyframes wrapIn {
    from { opacity: 0; transform: translateY(24px); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }

  .hero { text-align: center; margin-bottom: 44px; }
  .hero h1 {
    font-size: clamp(1.8rem, 5vw, 3rem);
    letter-spacing: 0.2em; font-weight: 700; color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.55), 0 0 30px rgba(255,255,255,0.25);
    animation: titlePulse 4s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.55), 0 0 30px rgba(255,255,255,0.25); }
    50%      { text-shadow: 0 0 14px rgba(255,255,255,0.75), 0 0 40px rgba(255,255,255,0.35); }
  }
  .hero p {
    margin-top: 14px;
    font-size: 0.72rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .hero h1 .ltr {
    display: inline-block;
    opacity: 0;
    transform: translateY(30px) rotateX(90deg);
    animation: ltrIn 0.8s cubic-bezier(.16,1,.3,1) forwards;
  }
  @keyframes ltrIn {
    to { opacity: 1; transform: translateY(0) rotateX(0); }
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 18px;
  }

  .tool {
    position: relative;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.35s ease, transform 0.4s cubic-bezier(.16,1,.3,1);
    display: flex;
    flex-direction: column;
    gap: 14px;
    opacity: 0;
    transform: translateY(60px) scale(0.96);
    filter: blur(10px);
    will-change: transform, opacity, filter;
  }
  .tool.revealed {
    animation: reveal 1.1s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay: var(--reveal-delay, 0ms);
  }
  @keyframes reveal {
    0%   { opacity: 0; transform: translateY(60px) scale(0.96); filter: blur(10px); }
    60%  { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .tool:hover {
    border-color: rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.045);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.7),
      0 0 60px rgba(255,255,255,0.08),
      0 0 100px rgba(255,255,255,0.04);
    transform: translateY(-6px) scale(1.01);
  }

  .tool::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 12px;
    padding: 1px;
    background: linear-gradient(135deg,
      rgba(255,255,255,0.4),
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(255,255,255,0.4));
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .tool:hover::before { opacity: 1; }

  .tool::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 12px;
    pointer-events: none;
    background: radial-gradient(
      600px circle at var(--mx, 50%) var(--my, 50%),
      rgba(255,255,255,0.08),
      transparent 40%
    );
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .tool:hover::after { opacity: 1; }

  .tool.wide { grid-column: 1 / -1; }

  .tool-head {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .tool-title {
    font-size: 0.72rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tool-title::before {
    content: "";
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent);
    animation: pulseDot 1.8s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.5; transform: scale(0.7); }
  }
  .tool-sub {
    font-size: 0.66rem;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.4);
    margin-top: -6px;
  }

  label {
    display: block;
    font-size: 0.62rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 6px;
    margin-top: 8px;
  }

  textarea, input[type="text"], select {
    width: 100%;
    padding: 11px 14px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: #fff;
    font-family: inherit;
    font-size: 0.82rem;
    line-height: 1.55;
    outline: none;
    transition: all 0.3s ease;
    resize: vertical;
  }
  textarea:focus, input[type="text"]:focus, select:focus {
    border-color: rgba(255,255,255,0.6);
    box-shadow:
      0 0 0 3px rgba(255,255,255,0.08),
      0 0 40px rgba(255,255,255,0.12);
    transform: translateY(-1px);
  }
  textarea {
    min-height: 100px;
    font-size: 0.78rem;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
  }

  .row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 6px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 18px;
    background: rgba(255,255,255,0.02);
    color: #fff;
    font-family: inherit;
    font-size: 0.68rem;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: lowercase;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 7px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.25s cubic-bezier(.16,1,.3,1);
    will-change: transform;
  }
  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #fff;
    transform: translateY(101%);
    transition: transform 0.45s cubic-bezier(.65,.05,.36,1);
    z-index: 0;
  }
  .btn > * { position: relative; z-index: 1; }
  .btn:hover {
    color: #000;
    border-color: #fff;
    letter-spacing: 0.3em;
    box-shadow:
      0 0 30px rgba(255,255,255,0.5),
      0 0 80px rgba(255,255,255,0.2);
  }
  .btn:hover::before { transform: translateY(0); }
  .btn:active { transform: scale(0.96) !important; }

  .btn.primary {
    background: #fff;
    color: #000;
    border-color: #fff;
    animation: primaryPulse 3s ease-in-out infinite;
  }
  @keyframes primaryPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.3), 0 0 40px rgba(255,255,255,0.1); }
    50%      { box-shadow: 0 0 30px rgba(255,255,255,0.5), 0 0 70px rgba(255,255,255,0.2); }
  }
  .btn.primary::before { background: #000; }
  .btn.primary:hover   { color: #fff; animation: none; }

  .btn.ghost {
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.75);
  }

  .out {
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.78rem;
    line-height: 1.65;
    color: #fff;
    word-break: break-all;
    white-space: pre-wrap;
    max-height: 260px;
    overflow-y: auto;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    transition: all 0.3s ease;
    position: relative;
  }
  .out:empty { display: none; }
  .out.ok  { border-color: rgba(134,239,172,0.4); }
  .out.err { border-color: rgba(248,113,113,0.5); color: #fca5a5; }
  .out.pop { animation: outPop 0.45s cubic-bezier(.16,1,.3,1); }
  @keyframes outPop {
    0%   { transform: scale(0.96); filter: blur(4px); opacity: 0; }
    60%  { opacity: 1; filter: blur(0); }
    100% { transform: scale(1);    filter: blur(0); opacity: 1; }
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 10px 22px;
    font-size: 0.7rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    z-index: 9;
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(.16,1,.3,1);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 640px) {
    .wrap { padding: 110px 16px 100px; }
    .tool { padding: 20px; }
    .grid { gap: 14px; }
  }
</style>
</head>
<body>

  <canvas id="stars"></canvas>
  <canvas id="fx"></canvas>
  <div class="cursor-glow" id="glow"></div>
  <div class="scroll-progress" id="progress"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="topbar">
    <a class="brand" href="/">
      <span class="dot"></span>
      <span>getsols.xyz</span>
      <span class="sep">/</span>
      <span class="path"><b>dev</b></span>
    </a>
  </div>

  <main class="wrap">

    <div class="hero">
      <h1 id="hero-title">dev tools</h1>
      <p>built for getsols workflows</p>
    </div>

    <div class="grid">

      <div class="tool">
        <div class="tool-head">
          <div class="tool-title">loadstring builder</div>
        </div>
        <div class="tool-sub">paste any script URL, get a ready loadstring.</div>
        <label>script url</label>
        <input type="text" id="ls-url" value="https://getsols.xyz/script.lua" />
        <div class="row">
          <button class="btn primary" id="ls-build"><span>build</span></button>
          <button class="btn ghost" id="ls-copy"><span>copy</span></button>
        </div>
        <label>output</label>
        <div class="out" id="ls-out"></div>
      </div>

      <div class="tool">
        <div class="tool-head">
          <div class="tool-title">lua beautifier</div>
        </div>
        <div class="tool-sub">paste ugly lua, get clean formatted lua.</div>
        <textarea id="bf-in" placeholder='local x=1 if x==1 then print("yes") end for i=1,10 do print(i) end'></textarea>
        <div class="row">
          <button class="btn primary" id="bf-go"><span>beautify</span></button>
          <button class="btn ghost" id="bf-clr"><span>clear</span></button>
          <button class="btn ghost" id="bf-copy"><span>copy</span></button>
        </div>
        <div class="out" id="bf-out"></div>
      </div>

      <div class="tool">
        <div class="tool-head">
          <div class="tool-title">string obfuscator</div>
        </div>
        <div class="tool-sub">basic character-code obfuscation for strings.</div>
        <label>input</label>
        <textarea id="obf-in" placeholder='print("hello world")'></textarea>
        <div class="row">
          <button class="btn primary" id="obf-go"><span>obfuscate</span></button>
          <button class="btn ghost" id="obf-copy"><span>copy</span></button>
        </div>
        <div class="out" id="obf-out"></div>
      </div>

    </div>

  </main>

  <div class="toast" id="toast"></div>

<script>
const toast = document.getElementById("toast");
function showToast(msg, ms = 1300) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), ms);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    return true;
  }
}

(function () {
  const el = document.getElementById("hero-title");
  const text = el.textContent;
  el.textContent = "";
  [...text].forEach((ch, i) => {
    const span = document.createElement("span");
    span.className = "ltr";
    span.textContent = ch === " " ? "\u00A0" : ch;
    span.style.animationDelay = (i * 60 + 300) + "ms";
    el.appendChild(span);
  });
})();

const lsUrl = document.getElementById("ls-url");
const lsOut = document.getElementById("ls-out");
let currentLS = "";
function buildLS() {
  const url = lsUrl.value.trim();
  if (!url) { lsOut.textContent = "paste a url first"; lsOut.className = "out err pop"; return; }
  currentLS = `loadstring(game:HttpGet("${url}"))()`;
  lsOut.textContent = currentLS;
  lsOut.className = "out ok pop";
}
document.getElementById("ls-build").addEventListener("click", buildLS);
document.getElementById("ls-copy").addEventListener("click", async () => {
  if (!currentLS) buildLS();
  if (!currentLS) return;
  await copyText(currentLS);
  showToast("loadstring copied");
});

const bfIn = document.getElementById("bf-in");
const bfOut = document.getElementById("bf-out");
let bfResult = "";
function beautifyLua(src) {
  let out = "", indent = 0, i = 0;
  const indentStr = "  ";
  let lineStart = true, inStr = false, strChar = "";
  function nl() {
    out = out.replace(/[ \t]+$/g, "");
    out += "\n" + indentStr.repeat(indent);
    lineStart = true;
  }
  while (i < src.length) {
    const c = src[i], next = src[i + 1];
    if (lineStart && c === " ") { i++; continue; }
    if (inStr) {
      out += c;
      if (c === strChar && src[i - 1] !== "\\") inStr = false;
      i++; continue;
    }
    if (c === "-" && next === "-") { while (i < src.length && src[i] !== "\n") { out += src[i]; i++; } continue; }
    if (c === '"' || c === "'") { inStr = true; strChar = c; out += c; lineStart = false; i++; continue; }
    if (c === "{") { out += "{"; if (next !== "}") { indent++; nl(); } i++; continue; }
    if (c === "}") {
      if (out.endsWith("\n" + indentStr.repeat(indent))) {
        out = out.slice(0, out.length - (1 + indentStr.length * indent));
        out = out.replace(/[ \t]+$/g, "");
      }
      indent = Math.max(0, indent - 1);
      if (!out.endsWith("\n")) out += "\n" + indentStr.repeat(indent);
      out += "}"; lineStart = false; i++; continue;
    }
    if (c === ";") { out += ";"; nl(); i++; continue; }
    if (c === " ") { if (!out.endsWith(" ") && !out.endsWith("\n") && out.length) out += " "; i++; continue; }
    if (c === "\n") { if (!out.endsWith("\n")) nl(); i++; continue; }
    if (c === "\t") { i++; continue; }
    out += c; lineStart = false; i++;
  }
  return out.replace(/\n{3,}/g, "\n\n").trim();
}
document.getElementById("bf-go").addEventListener("click", () => {
  try { bfResult = beautifyLua(bfIn.value); bfOut.textContent = bfResult; bfOut.className = "out ok pop"; }
  catch (e) { bfOut.textContent = "error: " + e.message; bfOut.className = "out err pop"; }
});
document.getElementById("bf-clr").addEventListener("click", () => {
  bfIn.value = ""; bfOut.textContent = ""; bfOut.className = "out";
});
document.getElementById("bf-copy").addEventListener("click", async () => {
  if (!bfResult) return showToast("nothing to copy");
  await copyText(bfResult);
  showToast("copied");
});

const obfIn = document.getElementById("obf-in");
const obfOut = document.getElementById("obf-out");
let obfResult = "";
function obfuscateLua(src) {
  let counter = 0;
  return src.replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, (match) => {
    counter++;
    const content = match.slice(1, -1);
    const codes = [];
    for (let i = 0; i < content.length; i++) codes.push("\\" + content.charCodeAt(i));
    const varName = "_" + Math.random().toString(36).slice(2, 6);
    return `${varName} = "${codes.join("")}" -- [[ str ${counter} ]]`;
  });
}
document.getElementById("obf-go").addEventListener("click", () => {
  obfResult = obfuscateLua(obfIn.value);
  obfOut.textContent = obfResult;
  obfOut.className = "out ok pop";
});
document.getElementById("obf-copy").addEventListener("click", async () => {
  if (!obfResult) return showToast("nothing to copy");
  await copyText(obfResult);
  showToast("copied");
});

const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("revealed");
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.15, rootMargin: "0px 0px -60px 0px" });

document.querySelectorAll(".tool").forEach((el, i) => {
  el.style.setProperty("--reveal-delay", (i * 100) + "ms");
  revealObserver.observe(el);
});

const progress = document.getElementById("progress");
window.addEventListener("scroll", () => {
  const h = document.documentElement;
  const scrolled = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
  progress.style.setProperty("--progress", Math.min(100, Math.max(0, scrolled)) + "%");
}, { passive: true });

let lastScroll = window.scrollY;
let scrollVelocity = 0;
const wrapEl = document.querySelector(".wrap");
window.addEventListener("scroll", () => {
  const y = window.scrollY;
  scrollVelocity = Math.abs(y - lastScroll);
  lastScroll = y;
  const blur = Math.min(scrollVelocity * 0.06, 3.5);
  if (blur > 0.15) wrapEl.style.filter = `blur(${blur}px)`;
  else wrapEl.style.filter = "";
}, { passive: true });

setInterval(() => {
  if (scrollVelocity > 0) {
    scrollVelocity *= 0.82;
    if (scrollVelocity < 0.15) {
      wrapEl.style.filter = "";
      scrollVelocity = 0;
    }
  }
}, 50);

document.querySelectorAll(".tool").forEach(tool => {
  tool.addEventListener("mousemove", (e) => {
    const rect = tool.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    tool.style.setProperty("--mx", x + "px");
    tool.style.setProperty("--my", y + "px");
  });
});

document.querySelectorAll(".btn").forEach(btn => {
  btn.addEventListener("mousemove", (e) => {
    const rect = btn.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top - rect.height / 2;
    btn.style.transform = `translate(${x * 0.15}px, ${y * 0.25 - 2}px) scale(1.04)`;
  });
  btn.addEventListener("mouseleave", () => { btn.style.transform = ""; });
});

const fx     = document.getElementById("fx");
const fxCtx  = fx.getContext("2d");
let fxW, fxH;
function resizeFX() {
  fxW = fx.width  = window.innerWidth;
  fxH = fx.height = window.innerHeight;
}
resizeFX();
window.addEventListener("resize", resizeFX);

const ripples = [];
const sparks  = [];

document.addEventListener("click", (e) => {
  if (e.target.closest("a, button, input, textarea")) return;
  ripples.push({ x: e.clientX, y: e.clientY, r: 0, max: 140, life: 1 });
  for (let i = 0; i < 14; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp  = 1 + Math.random() * 3.5;
    sparks.push({
      x: e.clientX, y: e.clientY,
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp,
      life: 1,
      r: 1 + Math.random() * 1.6,
    });
  }
});

function drawFX() {
  fxCtx.clearRect(0, 0, fxW, fxH);
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += (r.max - r.r) * 0.12;
    r.life -= 0.04;
    if (r.life <= 0) { ripples.splice(i, 1); continue; }
    fxCtx.beginPath();
    fxCtx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    fxCtx.strokeStyle = `rgba(255,255,255,${r.life * 0.7})`;
    fxCtx.lineWidth = 1.3;
    fxCtx.stroke();
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx; s.y += s.vy;
    s.vy += 0.08;
    s.vx *= 0.98; s.vy *= 0.98;
    s.life -= 0.025;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    fxCtx.beginPath();
    fxCtx.fillStyle = `rgba(255,255,255,${s.life})`;
    fxCtx.shadowColor = "rgba(255,255,255,0.9)";
    fxCtx.shadowBlur = 10;
    fxCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    fxCtx.fill();
    fxCtx.shadowBlur = 0;
  }
  requestAnimationFrame(drawFX);
}
drawFX();

const glow   = document.getElementById("glow");
const canvas = document.getElementById("stars");
const ctx    = canvas.getContext("2d");
let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const target  = { x: 0, y: 0 };
const current = { x: 0, y: 0 };
const cursor  = { x: W / 2, y: H / 2 };
const cursorEased = { x: W / 2, y: H / 2 };

window.addEventListener("mousemove", (e) => {
  target.x = (e.clientX / W) * 2 - 1;
  target.y = (e.clientY / H) * 2 - 1;
  cursor.x = e.clientX;
  cursor.y = e.clientY;
});
document.addEventListener("mouseover", (e) => {
  if (e.target.closest(".tool, .btn")) glow.classList.add("big");
  else glow.classList.remove("big");
});
window.addEventListener("mouseleave", () => { glow.style.opacity = "0"; });
window.addEventListener("mouseenter", () => { glow.style.opacity = "1"; });

const LAYERS = [
  { count: 160, r: 0.5, speed: 0.005, parallax: 8  },
  { count: 100, r: 0.9, speed: 0.010, parallax: 22 },
  { count: 55,  r: 1.4, speed: 0.018, parallax: 36 },
];
const layers = LAYERS.map((cfg) => {
  const stars = [];
  for (let i = 0; i < cfg.count; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: cfg.r * (0.7 + Math.random() * 0.6),
      base: 0.3 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      speed: cfg.speed, parallax: cfg.parallax,
    });
  }
  return stars;
});

const meteors = [];
function spawnMeteor() {
  meteors.push({
    x: Math.random() * W, y: -20,
    len: Math.random() * 100 + 80,
    speed: Math.random() * 5 + 5,
    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
  });
}
setInterval(spawnMeteor, 900);

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(0, 0, W, H);

  current.x += (target.x - current.x) * 0.05;
  current.y += (target.y - current.y) * 0.05;
  cursorEased.x += (cursor.x - cursorEased.x) * 0.18;
  cursorEased.y += (cursor.y - cursorEased.y) * 0.18;
  glow.style.transform = `translate(${cursorEased.x}px, ${cursorEased.y}px) translate(-50%, -50%)`;

  for (const stars of layers) {
    for (const s of stars) {
      s.phase += s.speed;
      const a  = s.base + Math.sin(s.phase) * 0.35;
      const px = s.x - current.x * s.parallax;
      const py = s.y - current.y * s.parallax;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, a))})`;
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += Math.cos(m.angle) * m.speed;
    m.y += Math.sin(m.angle) * m.speed;
    const tx = m.x - Math.cos(m.angle) * m.len;
    const ty = m.y - Math.sin(m.angle) * m.len;
    const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
    grad.addColorStop(0,    "rgba(255,255,255,1)");
    grad.addColorStop(0.35, "rgba(255,255,255,0.5)");
    grad.addColorStop(1,    "rgba(255,255,255,0)");
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.8;
    ctx.shadowColor = "rgba(255,255,255,0.9)";
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.fillStyle = "rgba(255,255,255,1)";
    ctx.arc(m.x, m.y, 1.6, 0, Math.PI * 2);
    ctx.fill();
    if (m.y > H + 100 || m.x > W + 100 || m.x < -100) meteors.splice(i, 1);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
