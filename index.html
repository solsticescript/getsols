<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>getsols.xyz</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #07060f;
      color: #e5e5e5;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      overflow: hidden;
    }
    #particles { position: fixed; inset: 0; z-index: 0; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(168, 85, 247, 0.18), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(34, 211, 238, 0.18), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.05), transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: glowShift 8s ease-in-out infinite alternate;
    }
    @keyframes glowShift {
      0%   { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1;   transform: scale(1.08); }
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
      z-index: 2;
    }
    .wrap {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 70px;
      padding: 24px;
    }
    .title-wrap { position: relative; display: inline-block; }
    .title {
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      font-weight: 700;
      letter-spacing: 3px;
      background: linear-gradient(90deg, #a855f7, #22d3ee, #a855f7);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      white-space: nowrap;
      animation:
        reveal 2.2s steps(12) 0.3s both,
        textShine 4s linear infinite 2.5s;
    }
    @keyframes reveal {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0 0 0); }
    }
    @keyframes textShine {
      0%   { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .title .cursor {
      display: inline-block;
      width: 3px;
      height: 0.9em;
      background: #22d3ee;
      margin-left: 4px;
      vertical-align: -0.1em;
      animation: blink 0.8s step-end infinite, hideCursor 0.01s 2.8s forwards;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
    @keyframes hideCursor { to { opacity: 0; } }

    .title-glow {
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle at center, rgba(168, 85, 247, 0.35), transparent 70%);
      filter: blur(20px);
      opacity: 0;
      z-index: -1;
      animation: fadeIn 1s 2.5s forwards, glowPulse 3s 3.5s ease-in-out infinite;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.15); }
    }
    .free-btn {
      display: inline-block;
      padding: 26px 90px;
      font-family: inherit;
      font-size: clamp(1.5rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: 8px;
      color: #fff;
      background: linear-gradient(135deg, #7c3aed, #a855f7, #22d3ee);
      background-size: 200% 200%;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 20px rgba(168, 85, 247, 0.5),
        0 0 40px rgba(34, 211, 238, 0.25);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      animation: gradientShift 4s ease infinite;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    .free-btn:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow:
        0 0 30px rgba(168, 85, 247, 0.9),
        0 0 60px rgba(34, 211, 238, 0.5);
    }
    .free-btn:active { transform: translateY(-1px) scale(0.99); }
    .free-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      transition: left 0.6s ease;
    }
    .free-btn:hover::before { left: 100%; }
    .free-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      animation: autoSweep 3.5s ease-in-out infinite;
    }
    @keyframes autoSweep {
      0%   { left: -60%; }
      60%  { left: 100%; }
      100% { left: 100%; }
    }
    .hint {
      font-size: 12px;
      color: #6b6b8a;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: -40px;
      animation: hintFade 3s ease-in-out infinite;
    }
    @keyframes hintFade {
      0%, 100% { opacity: 0.4; }
      50%      { opacity: 0.9; }
    }
    .corner {
      position: fixed;
      width: 28px;
      height: 28px;
      border-color: #a855f7;
      border-style: solid;
      opacity: 0.5;
      z-index: 3;
      animation: cornerPulse 3s ease-in-out infinite;
    }
    .corner.tl { top: 22px; left: 22px; border-width: 2px 0 0 2px; }
    .corner.tr { top: 22px; right: 22px; border-width: 2px 2px 0 0; animation-delay: 0.5s; }
    .corner.bl { bottom: 22px; left: 22px; border-width: 0 0 2px 2px; animation-delay: 1s; }
    .corner.br { bottom: 22px; right: 22px; border-width: 0 2px 2px 0; animation-delay: 1.5s; }
    @keyframes cornerPulse {
      0%, 100% { opacity: 0.3; }
      50%      { opacity: 0.8; }
    }
  </style>
</head>
<body>

  <canvas id="particles"></canvas>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="wrap">
    <div class="title-wrap">
      <div class="title-glow"></div>
      <h1 class="title">getsols.xyz<span class="cursor"></span></h1>
    </div>

    <a class="free-btn" href="https://discord.gg/bZaEnncaf" target="_blank" rel="noopener">
      FREE
    </a>

    <div class="hint">click to join</div>
  </div>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const count = Math.floor((canvas.width * canvas.height) / 18000);
      particles = [];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.8 + 0.4,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          color: Math.random() < 0.5 ? '168, 85, 247' : '34, 211, 238',
          baseAlpha: Math.random() * 0.5 + 0.3,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;
        if (p.y < -10) p.y = canvas.height + 10;
        if (p.y > canvas.height + 10) p.y = -10;
        p.phase += 0.02;
        const alpha = p.baseAlpha + Math.sin(p.phase) * 0.25;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color}, ${Math.max(0, alpha * 0.15)})`;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${p.color}, ${Math.max(0, alpha)})`;
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
