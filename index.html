<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>getsols.xyz</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    cursor: crosshair; /* normal cursor visible */
  }

  canvas#stars {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* Cursor glow */
  .cursor-glow {
    position: fixed;
    top: 0; left: 0;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
    transform: translate(-50%, -50%);
    background: radial-gradient(
      circle,
      rgba(255,255,255,0.18) 0%,
      rgba(255,255,255,0.08) 25%,
      rgba(255,255,255,0.03) 45%,
      rgba(255,255,255,0) 70%
    );
    mix-blend-mode: screen;
    transition: opacity 0.3s ease;
  }

  .corner {
    position: fixed;
    width: 22px;
    height: 22px;
    border: 1px solid #fff;
    opacity: 0.35;
    z-index: 5;
    pointer-events: none;
  }
  .corner.tl { top: 16px;    left: 16px;    border-right: none; border-bottom: none; }
  .corner.tr { top: 16px;    right: 16px;   border-left: none;  border-bottom: none; }
  .corner.bl { bottom: 16px; left: 16px;    border-right: none; border-top: none; }
  .corner.br { bottom: 16px; right: 16px;   border-left: none;  border-top: none; }

  .stage {
    position: relative;
    z-index: 6;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 20px;
    text-align: center;
  }

  .title {
    font-size: clamp(2rem, 7vw, 4.5rem);
    letter-spacing: 0.12em;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.35);
    min-height: 1.2em;
  }

  .title .cursor {
    display: inline-block;
    width: 3px;
    height: 0.9em;
    background: #fff;
    margin-left: 6px;
    transform: translateY(0.08em);
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    display: inline-block;
    padding: 16px 44px;
    background: transparent;
    color: #fff;
    font-family: inherit;
    font-size: 1rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1.5px solid #fff;
    border-radius: 6px;
    transition: all 0.25s ease;
    cursor: pointer; /* real pointer on buttons */
  }

  .btn:hover {
    background: #fff;
    color: #000;
    box-shadow: 0 0 24px rgba(255,255,255,0.55),
                0 0 60px rgba(255,255,255,0.25);
    transform: translateY(-1px);
  }

  .hint {
    font-size: 0.7rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }
</style>
</head>
<body>

  <canvas id="stars"></canvas>
  <div class="cursor-glow" id="glow"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <main class="stage">
    <h1 class="title"><span id="typed"></span><span class="cursor"></span></h1>

    <div class="buttons">
      <a class="btn" href="#" id="freeBtn">Free</a>
      <a class="btn" href="https://discord.gg/4whvyDFNBE" target="_blank" rel="noopener">Get Key</a>
    </div>

    <p class="hint">Click to join</p>
  </main>

<script>
/* ---------- Typewriter ---------- */
const text = "getsols.xyz";
const el = document.getElementById("typed");
let i = 0, forward = true;
function typeLoop() {
  if (forward) {
    el.textContent = text.slice(0, ++i);
    if (i === text.length) { forward = false; return setTimeout(typeLoop, 2200); }
    setTimeout(typeLoop, 110);
  } else {
    el.textContent = text.slice(0, --i);
    if (i === 0) { forward = true; return setTimeout(typeLoop, 700); }
    setTimeout(typeLoop, 60);
  }
}
typeLoop();

/* ---------- Cursor glow ---------- */
const glow = document.getElementById("glow");

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const target = { x: 0, y: 0 };
const current = { x: 0, y: 0 };
const cursor = { x: W / 2, y: H / 2 };
const cursorEased = { x: W / 2, y: H / 2 };

window.addEventListener("mousemove", (e) => {
  target.x = (e.clientX / W) * 2 - 1;
  target.y = (e.clientY / H) * 2 - 1;
  cursor.x = e.clientX;
  cursor.y = e.clientY;
});
window.addEventListener("mouseleave", () => { glow.style.opacity = "0"; });
window.addEventListener("mouseenter", () => { glow.style.opacity = "1"; });

/* Star layers */
const LAYERS = [
  { count: 120, r: 0.5, speed: 0.005, parallax: 8  },
  { count: 80,  r: 0.9, speed: 0.010, parallax: 18 },
  { count: 40,  r: 1.4, speed: 0.018, parallax: 32 },
];

const layers = LAYERS.map((cfg) => {
  const stars = [];
  for (let i = 0; i < cfg.count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: cfg.r * (0.7 + Math.random() * 0.6),
      base: 0.3 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      speed: cfg.speed,
      parallax: cfg.parallax,
    });
  }
  return stars;
});

/* Meteors */
const meteors = [];
function spawnMeteor() {
  meteors.push({
    x: Math.random() * W,
    y: -20,
    len: Math.random() * 80 + 60,
    speed: Math.random() * 4 + 4,
    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.3,
  });
}
setInterval(spawnMeteor, 1400);

function draw() {
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.fillRect(0, 0, W, H);

  const t = performance.now() / 1000;

  current.x += (target.x - current.x) * 0.05;
  current.y += (target.y - current.y) * 0.05;
  cursorEased.x += (cursor.x - cursorEased.x) * 0.18;
  cursorEased.y += (cursor.y - cursorEased.y) * 0.18;

  glow.style.transform = `translate(${cursorEased.x}px, ${cursorEased.y}px) translate(-50%, -50%)`;

  for (const stars of layers) {
    for (const s of stars) {
      s.phase += s.speed;
      const a = s.base + Math.sin(s.phase) * 0.35;
      const px = s.x - current.x * s.parallax;
      const py = s.y - current.y * s.parallax;

      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, a))})`;
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += Math.cos(m.angle) * m.speed;
    m.y += Math.sin(m.angle) * m.speed;

    const tailX = m.x - Math.cos(m.angle) * m.len;
    const tailY = m.y - Math.sin(m.angle) * m.len;

    const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
    grad.addColorStop(0, "rgba(255,255,255,0.95)");
    grad.addColorStop(0.3, "rgba(255,255,255,0.4)");
    grad.addColorStop(1, "rgba(255,255,255,0)");

    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(tailX, tailY);
    ctx.stroke();

    if (m.y > H + 100 || m.x > W + 100 || m.x < -100) {
      meteors.splice(i, 1);
    }
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
